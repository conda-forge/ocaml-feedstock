conda_build:
  error_overlinking: true
conda_build_tool: rattler-build
conda_forge_output_validation: true
conda_install_tool: pixi
github:
  branch_name: main
  tooling_branch_name: main
build_platform:
  linux_ppc64le: linux_aarch64
  linux_riscv64: linux_aarch64
  linux_s390x: linux_aarch64
  osx_64: osx_arm64
provider:
  linux_aarch64: default
  osx_64: azure
  osx_arm64: azure
  win_arm64: default
test: all
upload_on_branch: main
