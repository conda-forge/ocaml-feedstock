c_compiler:
  - if: not unix and x86_64
    then:
      - vs2022
      - gcc
  - if: not unix and arm64
    then:
      - zig

c_compiler_version:
  - if: s390x
    then:
      - 14

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-64
  - win-arm64

# The s390x cross-target lane bootstraps from main-channel ocaml: the label's
# gcc 15 builds conflict with the gcc 14 s390x toolchain.
channel_sources:
  - if: s390x
    then: conda-forge/label/zig_dev,conda-forge
    else: conda-forge/label/ocaml_experimental,conda-forge/label/zig_dev,conda-forge

# Uploads from this branch go to the ocaml_experimental label, not main.
channel_targets:
  - conda-forge ocaml_experimental
