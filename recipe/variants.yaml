channel_sources:
  - conda-forge/label/ocaml_experimental,conda-forge/label/zig_experimental,conda-forge
channel_targets:
  - conda-forge ocaml_experimental

c_compiler:
  - if: not unix
    then:
      - vs2022
      - gcc
      - zig

m2w64_c_compiler_version:
  - "14"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - osx-64
  - osx-arm64
  - win-64
  - win-arm64

ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.0"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"
