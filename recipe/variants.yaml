c_compiler:
  - if: not unix and x86_64
    then:
      - vs
      - gcc
  - if: not unix and arm64
    then:
      - zig

c_compiler_version:
  - if: s390x
    then:
      - 14

# This branch publishes only the non-unix lanes to the ocaml_vs label.
cross_target_platform_:
  # - linux-64
  # - linux-aarch64
  # - linux-ppc64le
  # - linux-riscv64
  # - linux-s390x
  # - osx-64
  # - osx-arm64
  - win-64
  - win-arm64

# Fresh label: nothing to read from it yet.
channel_sources:
  - conda-forge

# Uploads from this branch go to the ocaml_vs label, not main.
channel_targets:
  - conda-forge ocaml_vs
