c_compiler:
  - if: not unix
    then:
      - vs2022
      - gcc

# conda-forge has no gcc_impl_linux-s390x newer than 14.
c_compiler_version:
  - if: s390x
    then:
      - "14"

c_stdlib_version:
  - if: linux and not (aarch64 or ppc64le or s390x or x86_64)
    then:
      - "2.39"

cross_target_platform_:
  - linux-64
  - linux-aarch64
  - linux-ppc64le
  - linux-riscv64
  - linux-s390x
  - osx-64
  - osx-arm64
  - win-64
  - win-arm64

ocaml_compiler:
  - ocaml
ocaml_compiler_version:
  - "5.4.0"

zig_compiler:
  - zig
zig_compiler_version:
  - "0.16.0"
